<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ef; --card: #fffdf8; --ink: #3d3529; --sub: #8a7f6d;
    --line: #e8dfd0; --accent: #c26d4f; --accent-soft: #f3e0d7;
    --sage: #7d9478; --sage-soft: #e6ede4; --plum: #8d6a89;
    --danger: #b5533c; --star: #e0a63c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; line-height: 1.6;
  }
  h1, h2, .preview, .speech, .final-card .t { font-family: 'Gowun Batang', serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 16px 90px; }
  .band { height: 5px; border-radius: 3px; margin-bottom: 18px;
    background: linear-gradient(90deg, #c26d4f, #d9a353, #7d9478, #8d6a89); }
  h1 { font-size: 22px; letter-spacing: -0.3px; }
  h2 { font-size: 17px; margin-bottom: 10px; }
  .sub { color: var(--sub); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-top: 14px;
    box-shadow: 0 1px 3px rgba(61,53,41,.05); }
  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; font-size: 16px; background: #fff;
    font-family: inherit; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 16px;
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; }
  .btn:disabled { background: #d8cfc0; cursor: not-allowed; }
  .btn-ghost { background: none; border: 1.5px solid var(--line); color: var(--sub);
    padding: 10px; border-radius: 10px; width: 100%; margin-top: 10px; font-size: 14px; }
  .chip { display: inline-block; font-size: 12px; padding: 3px 10px;
    border-radius: 20px; margin: 3px 4px 0 0; }
  .chip.ok { background: var(--sage-soft); color: var(--sage); }
  .chip.bad { background: #f6e3de; color: var(--danger); }
  .chip.warn { background: #f7edd8; color: #a07d2a; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 70px; padding: 9px 4px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
    font-size: 13px; color: var(--sub); }
  .tab.on { border-color: var(--accent); background: var(--accent-soft);
    color: var(--accent); font-weight: 700; }
  .preview { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px;
    margin-top: 14px; font-size: 16px; font-weight: 600; min-height: 48px; }
  .check-row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0;
    font-size: 14px; border-bottom: 1px dashed var(--line); }
  .check-row input { width: 19px; height: 19px; margin-top: 3px; accent-color: var(--sage); }
  .wait-box { text-align: center; padding: 44px 20px; }
  .wait-box .big { font-size: 44px; margin-bottom: 12px; }
  .guide { background: #f4efe4; border-left: 4px solid var(--star);
    border-radius: 0 12px 12px 0; padding: 14px 16px; font-size: 14px; margin-top: 14px; }
  .vote-card { background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .vote-card .t { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .vote-row { display: flex; gap: 8px; align-items: center; }
  .star-btn { font-size: 22px; background: none; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 5px 14px; filter: grayscale(1); opacity: .45; }
  .star-btn.on { filter: none; opacity: 1; border-color: var(--star); background: #fdf6e5; }
  .stance { display: flex; flex: 1; gap: 6px; }
  .stance button { flex: 1; padding: 9px 0; border: 1.5px solid var(--line);
    border-radius: 10px; background: #fff; font-size: 14px; color: var(--sub); }
  .stance .pro.on { background: var(--sage-soft); border-color: var(--sage);
    color: var(--sage); font-weight: 700; }
  .stance .con.on { background: #f6e3de; border-color: var(--danger);
    color: var(--danger); font-weight: 700; }
  .footer-bar { position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,253,248,.97); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: none; }
  .footer-bar .inner { max-width: 560px; margin: 0 auto; display: flex;
    align-items: center; gap: 12px; }
  .footer-bar .stat { font-size: 13px; color: var(--sub); flex: 1; line-height: 1.4; }
  .footer-bar .btn { width: auto; margin: 0; padding: 12px 22px; font-size: 15px; }
  .final-card { border: 2px solid var(--accent); border-radius: 14px;
    padding: 16px; margin-top: 12px; background: var(--card); }
  .final-card .who { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 6px; }
  .divider { text-align: center; color: var(--line); margin: 18px 0 4px;
    letter-spacing: 8px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; white-space: pre-line; }
  .mine-list { font-size: 14px; padding: 8px 0 0; }
  .mine-list li { margin: 6px 0 0 18px; }
  .hint-toggle { font-size: 12px; color: var(--plum); background: none; border: none;
    text-decoration: underline; margin-top: 6px; }
  .task-banner { background: var(--accent); color: #fff; border-radius: 12px;
    padding: 12px 16px; font-size: 15px; font-weight: 800; margin-top: 14px; }
  details.guide summary { cursor: pointer; font-weight: 700; font-size: 14px; }
  details.guide[open] summary { margin-bottom: 8px; }
  .speech { font-size: 17px; line-height: 1.9; }
  .speech p { margin-bottom: 14px; }
  .speech .sec { color: var(--accent); font-weight: 800; font-size: 14px;
    margin: 18px 0 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="footer-bar" id="footer"></div>

<script>
/* 강의 시연용 데모 — 20명 학급의 「3구역, 1구역」(김혜진) 수업 결과가 심어져 있습니다.
   오른쪽 위 단계 버튼(1.밑줄→5.토론)으로 수업 흐름을 시연하세요. 문단 번호는 시연용 가상 번호입니다. */
(function () {
  var M = {
    phase: 'POSTIT',
    session: {
      code: '1234', work: '3구역, 1구역',
      characters: ['나', '너', '태비', '고양이', '교회', '3구역', '1구역', '재개발', '쉼터', '세림 빌라', '작가', '김혜진', '제목', '결말']
    },
    predicateBank: [
      ['어쩔 수 없었다', '잘못이었다', '불가피했다'],
      ['나쁘다', '무책임하다', '묵인이다'],
      ['슬프다', '패배다', '인정이다'],
      ['착하다', '정당했다', '최선이었다'],
      ['감동적이다', '용기다', '모순이다']
    ],
    brokenCards: [
      { id: 1, text: '부모는 자녀를 이해해야 한다', hint: '인물 이름이 없다' },
      { id: 2, text: '이 소설은 슬프고 주제가 잘 드러난다', hint: "'그리고'로 두 주장이 붙어 있다" },
      { id: 3, text: '주인공의 행동은 나쁘다', hint: '이름이 없고 도덕 판정이다' }
    ],
    selfCheck: [
      '책을 읽지 않은 사람은 이 논제로 토론에 낄 수 없다',
      '우리 반 절반쯤은 반대할 것 같다',
      '근거가 되는 문단을 2군데 이상 댈 수 있다',
      "'그리고·그런데'로 두 주장을 붙이지 않았다",
      '평가하는 말(가치어)이 하나뿐이다'
    ],
    starLimit: 3,
    guide: '<b>왜 좋은 논제를 골라야 할까?</b><br>좋은 논제 하나가 좋은 토론을 만듭니다. 뻔한 논제를 고르면 뻔한 말만 오가고, 갈리는 논제를 고르면 책을 다시 펴게 됩니다.<br>이 토론의 과정은 <b>생활기록부 교과 세부능력·특기사항</b>에 기록됩니다.<br>⭐ 별 3개는 "내가 토론하고 싶은 논제"에, 찬성/반대는 솔직한 내 입장대로 눌러 주세요.',
    students: ['강민서', '고은채', '김도현', '김하늘', '나윤호', '문지유', '박서연', '박준우', '배소미', '서지호',
               '손예린', '안태양', '오하람', '이도윤', '이수아', '장현우', '전민재', '정지우', '조아인', '한소율'],
    postits: [
      { author: '김하늘', phrase: '그런 공포를 느끼지 않은 건 아주 오랜만의 일이었다.', comment: '첫 만남에서 공포부터 이야기하는 게 이상해서', para: '8' },
      { author: '박준우', phrase: '쓰레기와 온갖 잡동사니로 발 디딜 데 없는 공터에서 줄담배를 피우는 모습을 본 적이 있었다.', comment: '분식집 사장 장면이 계속 마음에 걸림', para: '17' },
      { author: '이도윤', phrase: '그 사람만 아니었으면 여기 벌써 아파트 올라가고 있을걸요.', comment: '교회 앞의 그 사람과 같은 사람 맞나 싶어서', para: '23' },
      { author: '김도현', phrase: '사람들이 참 이기적이지 않아요? 일일이 사정 다 봐주면서 재개발하는 데가 어디 있어요.', comment: '자기 얘긴 줄 모르는 것 같다', para: '25' },
      { author: '박서연', phrase: '계속 추가되는 병원비와 입원비 내역을 듣는 네 얼굴에선 걱정스럽거나 놀라운 기색을 발견하기 어려웠다.', comment: '120만 원인데 아무렇지 않다니', para: '27' },
      { author: '손예린', phrase: '네가 입은 모직 니트에서 버터 냄새 같은 게 올라오다 말다가 했다.', comment: '냄새 묘사가 이상하게 기억에 남음', para: '31' },
      { author: '이수아', phrase: '나는 태비를 기다리고 있다는 사실을 종종 잊었다.', comment: '진짜 기다린 건 뭐였을까', para: '40' },
      { author: '정지우', phrase: '"잘한 거죠. 정말 백번 잘한 일이죠." 나는 고개를 끄덕이고 말았다.', comment: "'끄덕이고 말았다'의 '말았다'가 걸린다", para: '48' },
      { author: '장현우', phrase: '요령 있는 사람들이야 어디서나 잘살죠. 아무것도 모르는 고양이들만 불쌍하지.', comment: '사람은 왜 안 불쌍한가', para: '58' },
      { author: '강민서', phrase: '어떤 의도 같은 게 있을 리 없다고 생각하면서도 네가 한 말의 의미를 자꾸 요리조리 돌려보게 됐다.', comment: '나도 이 소설을 이렇게 읽고 있음', para: '61' },
      { author: '한소율', phrase: '그 밤에 내가 실감한 건 너와의 간극이었고 격차였다.', comment: '마음을 끝낸 게 감정이 아니라 격차라는 것', para: '70' },
      { author: '고은채', phrase: '3구역 사람들이 다 이렇게 군말 없이 빨리 나가주면 참 좋을 텐데.', comment: '빈집 고양이를 걱정한 직후에 이 말을 함', para: '79' },
      { author: '문지유', phrase: '그러므로 결코 내가 다 알 수 없는 사람이라는 생각이 들었다.', comment: '이게 이 소설의 결론인가', para: '81' },
      { author: '서지호', phrase: '나는 또다시 이끌린 듯 그러겠다고 대답하며 걸음을 빨리하고 있었다.', comment: "마지막이 왜 '걸음을 빨리'일까", para: '88' }
    ],
    topics: [
      { id: 'T1', author: '김하늘', text: '너의 고양이 사랑은 진심이다.', frame: '자유', final: 'O' },
      { id: 'T2', author: '이도윤', text: "'나'가 마지막에 쉼터로 따라간 것은 호감이 아니라 체념이다.", frame: '틀B', final: '' },
      { id: 'T3', author: '박서연', text: "작가가 '너'의 속마음을 끝까지 감춘 것은 성공적이다.", frame: '자유', final: '' },
      { id: 'T4', author: '김도현', text: '너에게 고양이 구조와 재개발은 같은 일이다.', frame: '자유', final: '' },
      { id: 'T5', author: '이수아', text: "이 소설의 제목이 '너와 나'가 아니라 '3구역, 1구역'인 것은 옳았다.", frame: '자유', final: '' },
      { id: 'T6', author: '정지우', text: "'나'가 대출 권유를 거절한 것은 자존심이 아니라 두려움이다.", frame: '틀B', final: '' },
      { id: 'T7', author: '장현우', text: '세림 빌라에서 고양이를 찾는 너의 필사적임은 죄책감이다.', frame: '자유', final: '' },
      { id: 'T8', author: '강민서', text: "너를 만난 것은 '나'에게 잘못이었다.", frame: '수리', final: '' },
      { id: 'T9', author: '한소율', text: "'나'의 침묵은 예의가 아니라 묵인이다.", frame: '틀B', final: '' },
      { id: 'T10', author: '고은채', text: '태비는 불쌍하다.', frame: '자유', final: '' },
      { id: 'T11', author: '나윤호', text: "너는 다정하고 그리고 '나'는 외롭다.", frame: '자유', final: '' },

      { id: 'T13', author: '서지호', text: '태비의 구내염은 3구역의 병이다.', frame: '자유', final: '' },
      { id: 'T14', author: '손예린', text: '너의 쉼터는 선행이 아니라 알리바이다.', frame: '틀B', final: '' },
      { id: 'T15', author: '안태양', text: "'나'는 너를 사랑했다.", frame: '자유', final: '' },
      { id: 'T16', author: '문지유', text: '작가가 결말을 열어둔 것은 무책임하다.', frame: '틀A', final: '' }
    ],
    votes: [],
    speeches: [
      { topicId: 'T1', stance: '찬성', members: '김하늘, 박준우, 손예린, 조아인, 강민서',
        text: '저희는 이 논제에 찬성합니다. 너는 모순된 사람일지언정, 고양이 앞에서만큼은 진짜라고 생각합니다.\n\n첫째, 너는 비용 앞에서 흔들리지 않습니다. 27번 문단, 병원비가 50만 원에서 120만 원으로 불어나는 동안 너의 얼굴에는 아무 기색이 없습니다. 아까워하는 마음이 없는 자리에 거짓은 끼어들기 어렵습니다.\n\n둘째, 너는 아무도 보지 않는 곳에서 가장 필사적입니다. 76번 문단, 빈집의 싱크대 밑과 신발장, 베란다 선반까지 뒤지는 그 모습에는 관객이 없습니다. 보여주기 위한 선행이라면 거기서 멈췄을 것입니다.\n\n[반론] 상대측은 79번 문단을 들어 사랑까지 부정하려 합니다. 하지만 그 문단이 보여주는 것은 모순이지 거짓이 아닙니다. 모순된 사람이라는 것과 사랑이 거짓이라는 것은 서로 다른 주장이며, 상대측의 인용은 두번째 주장까지 이어지지 못합니다.\n\n또한 상대측은 고양이만 불쌍하다는 말을 진심의 반증으로 들었습니다. 하지만 너는 3구역 출신입니다. 사람의 사정을 몰라서가 아니라 너무 잘 알기 때문에 나온 자기방어이며, 그 방어막 안에서도 끝까지 남겨둔 것이 고양이라면 그곳이야말로 진심의 자리입니다. 그래서 저희는 찬성합니다.' },

        });
      });
      M.votes = v;
    }
  };
  M.seedVotes();
  window.__MOCK = M;

  function computeResults() {
    var map = {};
    M.topics.forEach(function (t) {
      map[t.id] = { id: t.id, author: t.author, text: t.text, frame: t.frame,
        stars: 0, pro: 0, con: 0, proNames: [], conNames: [], final: t.final === 'O' };
    });
    M.votes.forEach(function (r) {
      var t = map[r.topicId]; if (!t) return;
      if (r.star === 1) t.stars++;
      if (r.stance === '찬성') { t.pro++; t.proNames.push(r.voter); }
      else if (r.stance === '반대') { t.con++; t.conNames.push(r.voter); }
    });
    var list = Object.keys(map).map(function (k) { return map[k]; });
    list.sort(function (a, b) { return (b.stars - a.stars) || String(a.id).localeCompare(String(b.id)); });
    list.forEach(function (t, i) {
      t.rank = i + 1;
      var tot = t.pro + t.con, ratio = tot ? t.pro / tot : 0;
      t.close = tot >= 5 && ratio >= 0.4 && ratio <= 0.6;
    });
    return list;
  }

  var API = {
    joinSession: function (code, name) {
      if (String(code) !== M.session.code) throw new Error('세션 코드를 확인하세요.');
      if (M.students.indexOf(name) < 0) M.students.push(name);
      return { code: M.session.code, work: M.session.work, characters: M.session.characters,
        phase: M.phase, predicateBank: M.predicateBank, brokenCards: M.brokenCards,
        selfCheck: M.selfCheck, starLimit: M.starLimit };
    },
    getPhase: function () { return M.phase; },
    submitPostit: function (code, name, phrase, comment, para) {
      if (!phrase) throw new Error('밑줄 그은 구절을 옮겨 적어 주세요.');
      if (!para) throw new Error('문단 번호를 적어 주세요.');
      M.postits.push({ author: name, phrase: phrase, comment: comment, para: para });
      return { ok: true };
    },
    submitTopic: function (code, name, t) {
      var norm = String(t.text || '').replace(/\s+/g, '');
      var hasChar = M.session.characters.some(function (c) { return norm.indexOf(c.replace(/\s+/g, '')) >= 0; });
      if (!hasChar) throw new Error('논제에 작품의 핵심어가 하나는 들어가야 합니다.');
      var id = 'T' + (M.topics.length + 1) + '_' + Math.floor(Math.random() * 1000);
      M.topics.push({ id: id, author: name, text: t.text, frame: t.frame, final: '' });
      return { ok: true, id: id };
    },
    getBallot: function (code, name) {
      var topics = M.topics.filter(function (t) { return t.author !== name; })
        .map(function (t) { return { id: t.id, text: t.text }; });
      return { guide: M.guide, starLimit: M.starLimit, topics: topics,
        alreadyVoted: M.votes.some(function (v) { return v.voter === name; }) };
    },
    submitVotes: function (code, name, votes) {
      var stars = votes.filter(function (v) { return v.star; }).length;
      if (stars > M.starLimit) throw new Error('별은 최대 ' + M.starLimit + '개입니다.');
      M.votes = M.votes.filter(function (v) { return v.voter !== name; });
      votes.forEach(function (v) {
        M.votes.push({ topicId: v.id, voter: name, star: v.star ? 1 : 0, stance: v.stance });
      });
      return { ok: true };
    },
    submitDebateCard: function (code, name, c) {
      if (!c.topicId) throw new Error('어느 논제의 카드인지 선택하세요.');
      if ((c.kind === '입론' || c.kind === '반론') && !c.members) throw new Error('모둠 구성원 이름을 적으세요.');
      if (c.kind === '반론' && !c.target) throw new Error('상대 주장을 한 줄로 적으세요.');
      M.debateCards.push({ topicId: c.topicId, author: name, kind: c.kind, para: c.para, stance: c.stance || '',
        body: c.body, quote: c.quote, interp: (c.kind === '반론' ? (c.target || '') : c.interp),
        members: c.members || '' });
      return { ok: true };
    },
    saveSpeech: function (code, name, topicId, stance, members, text) {
      if (!String(text || '').trim()) throw new Error('발표문이 비어 있습니다.');
      if (!String(members || '').trim()) throw new Error('모둠 구성원을 입력하세요 (팀 구분에 사용됩니다).');
      var nt = function (x) { return String(x || '').replace(/\s+/g, ''); };
      M.speeches = (M.speeches || []).filter(function (s) {
        return !(String(s.topicId) === String(topicId) && s.stance === stance && nt(s.members) === nt(members));
      });
      M.speeches.push({ topicId: topicId, stance: stance, members: members || '', text: text });
      return { ok: true };
    },
    getSpeech: function (code, topicId, stance, members) {
      var nt = function (x) { return String(x || '').replace(/\s+/g, ''); };
      var found = null;
      (M.speeches || []).forEach(function (s) {
        if (String(s.topicId) === String(topicId) && s.stance === stance && nt(s.members) === nt(members)) found = s;
      });
      return found ? { text: found.text, members: found.members } : null;
    },
    submitReflectCard: function (code, name, kind, body) {
      if (!String(body || '').trim()) throw new Error('내용을 적어 주세요.');
      M.rcards.push({ author: name, kind: kind || '자유', body: body });
      return { ok: true };
    },
    getReflectHome: function (code, name) {
      var cards = M.rcards.filter(function (c) { return c.author === name; })
        .map(function (c) { return { kind: c.kind, body: c.body }; });
      var text = null;
      M.reflections.forEach(function (r) { if (r.author === name) text = r.text; });
      return { myCards: cards, myText: text };
    },
    saveReflection: function (code, name, text) {
      if (!String(text || '').trim()) throw new Error('소감문이 비어 있습니다.');
      M.reflections = M.reflections.filter(function (r) { return r.author !== name; });
      M.reflections.push({ author: name, text: text });
      return { ok: true };
    },
    getStudentReport: function (pin, code, name) { return API.__report(name); },
    getAllReports: function (pin, code) {
      return M.students.map(function (n) { return API.__report(n); });
    },
    __report: function (name) {
      var nt = function (x) { return String(x || '').replace(/\s+/g, ''); };
      var hasMember = function (members, nm) {
        return String(members || '').split(',').some(function (m) { return nt(m) === nt(nm); });
      };
      var results = computeResults();
      var rep = {
        name: name, work: M.session.work,
        postits: M.postits.filter(function (p) { return p.author === name; })
          .map(function (p) { return { phrase: p.phrase, comment: p.comment, para: p.para }; }),
        topics: results.filter(function (t) { return t.author === name; })
          .map(function (t) { return { text: t.text, stars: t.stars, pro: t.pro, con: t.con, final: t.final }; }),
        team: null,
        reflectCards: M.rcards.filter(function (c) { return c.author === name; })
          .map(function (c) { return { kind: c.kind, body: c.body }; }),
        reflection: ''
      };
      M.reflections.forEach(function (r) { if (r.author === name) rep.reflection = r.text; });
      var teamCards = M.debateCards.filter(function (c) {
        return c.author === name || hasMember(c.members, name);
      });
      if (teamCards.length) {
        var first = teamCards[0];
        var topicText = '';
        results.forEach(function (t) { if (String(t.id) === String(first.topicId)) topicText = t.text; });
        rep.team = { topic: topicText, stance: first.stance || '', members: first.members || '',
          cards: teamCards.map(function (c) {
            return { kind: c.kind, para: c.para, body: c.body, quote: c.quote, interp: c.interp, author: c.author };
          }),
          speech: '' };
        (M.speeches || []).forEach(function (sp) {
          if (String(sp.topicId) === String(first.topicId) && sp.stance === (first.stance || '') &&
              hasMember(sp.members, name)) rep.team.speech = sp.text;
        });
      }
      return rep;
    },
    getDebateHome: function (code, name) {
      var topics = computeResults().filter(function (t) { return t.final; });
      var mine = M.debateCards.filter(function (c) { return c.author === name; })
        .map(function (c) { return { kind: c.kind, para: c.para, body: c.body, quote: c.quote, interp: c.interp }; });
      return { topics: topics, myCards: mine };
    },
    getFinalTopics: function () {
      return computeResults().filter(function (t) { return t.final; });
    },
    createSession: function (pin, work, chars) {
      return { code: M.session.code, work: M.session.work };
    },
    openSession: function () {
      return { code: M.session.code, work: M.session.work, characters: M.session.characters, phase: M.phase };
    },
    setPhase: function (pin, code, phase) { M.phase = phase; return { phase: phase }; },
    setFinal: function (pin, code, ids) {
      M.topics.forEach(function (t) { t.final = ids.indexOf(t.id) >= 0 ? 'O' : ''; });
      M.phase = 'FINAL';
      return { ok: true };
    },
    getTeacherState: function () {
      var st = { phase: M.phase, work: M.session.work, characters: M.session.characters,
        students: M.students.slice() };
      if (M.phase === 'POSTIT' || M.phase === 'TOPIC') st.postits = M.postits.slice();
      if (M.phase === 'TOPIC' || M.phase === 'VOTE') {
        st.topics = M.topics.map(function (t) {
          return { id: t.id, author: t.author, text: t.text, frame: t.frame,
            warnAnd: /그리고|그런데/.test(t.text) };
        });
      }
      if (M.phase === 'VOTE') {
        var voters = {};
        M.votes.forEach(function (v) { voters[v.voter] = true; });
        st.voted = Object.keys(voters);
      }
      if (M.phase === 'RESULT' || M.phase === 'FINAL') st.results = computeResults();
      if (M.phase === 'FINAL') { st.debateCards = M.debateCards.slice(); st.speeches = (M.speeches || []).slice(); }
      if (M.phase === 'REFLECT') {
        var rd = {};
        M.reflections.forEach(function (r) { rd[r.author] = true; });
        st.reflected = Object.keys(rd);
        st.rcardCount = M.rcards.length;
      }
      return st;
    }
  };

  function Runner(ok, fail) {
    var self = {};
    self.withSuccessHandler = function (f) { return Runner(f, fail); };
    self.withFailureHandler = function (f) { return Runner(ok, f); };
    Object.keys(API).forEach(function (name) {
      self[name] = function () {
        var args = arguments;
        setTimeout(function () {
          try { var r = API[name].apply(null, args); (ok || function () {})(r); }
          catch (e) { (fail || function (e) { alert(e.message || e); })(e); }
        }, 120);
      };
    });
    return self;
  }
  window.google = { script: { run: Runner(null, null) } };

  window.addEventListener('DOMContentLoaded', function () {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:6px;right:6px;z-index:9999;background:#3d3529;color:#fff;' +
      'padding:8px 10px;border-radius:10px;font-size:12px;opacity:.92';
    bar.innerHTML = '<b>시연 단계</b>: ' + [
      ['POSTIT', '1.밑줄'], ['TOPIC', '2.논제'], ['VOTE', '3.투표'],
      ['RESULT', '4.결과'], ['FINAL', '5.토론'], ['REFLECT', '6.소감']
    ].map(function (p) {
      return '<button style="margin:2px;font-size:12px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer" ' +
        'onclick="window.__MOCK.phase=\'' + p[0] + '\'">' + p[1] + '</button>';
    }).join('');
    document.body.appendChild(bar);
  });
})();

</script>
<script>
/* ───────── 상태 ───────── */
var S = {
  code: null, name: null, work: '', characters: [], phase: null,
  predicateBank: [], brokenCards: [], selfCheck: [], starLimit: 3,
  ballot: null, votes: {}, voteSubmitted: false,
  frame: 'A', brokenPick: 0, postitCount: 0, myTopics: []
};

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function run(ok, fail) {
  var r = google.script.run.withSuccessHandler(ok || function () {});
  r = r.withFailureHandler(fail || function (e) { alert(e.message || e); });
  return r;
}
function app(html) { $('app').innerHTML = '<div class="band"></div>' + html; $('footer').style.display = 'none'; }

/* ───────── 입장 ───────── */
function renderJoin(msg) {
  app(
    '<h1>독서토론으로 깊이 읽기 📖</h1><div class="sub">논제를 만드는 사람이 책을 가장 깊게 읽는다</div>' +
    '<div class="card">' +
    '<label>세션 코드</label><input type="number" id="j-code" placeholder="칠판의 4자리 숫자" inputmode="numeric">' +
    '<label>이름</label><input type="text" id="j-name" placeholder="실명을 입력하세요">' +
    (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<button class="btn" onclick="join()">입장하기</button></div>'
  );
  var saved = localStorage.getItem('gg_join');
  if (saved) {
    try {
      var o = JSON.parse(saved);
      $('j-code').value = o.code; $('j-name').value = o.name;
    } catch (e) {}
  }
}

function join() {
  var code = $('j-code').value.trim(), name = $('j-name').value.trim();
  if (!code || !name) return renderJoin('코드와 이름을 모두 입력하세요.');
  app('<div class="wait-box"><div class="big">🌱</div>입장 중...</div>');
  run(function (res) {
    S.code = res.code; S.name = name; S.work = res.work;
    S.characters = res.characters; S.predicateBank = res.predicateBank;
    S.brokenCards = res.brokenCards; S.selfCheck = res.selfCheck;
    S.starLimit = res.starLimit; S.phase = res.phase;
    localStorage.setItem('gg_join', JSON.stringify({ code: code, name: name }));
    onPhase(); startPoll();
  }, function (e) { renderJoin(e.message || String(e)); }).joinSession(code, name);
}

/* ───────── 폴링 ───────── */
var pollTimer = null;
function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (!S.code) return;
    run(function (p) {
      if (p !== S.phase) { S.phase = p; onPhase(); }
    }, function () {}).getPhase(S.code);
  }, 4000);
}

function onPhase() {
  switch (S.phase) {
    case 'WAIT':   return renderWait();
    case 'POSTIT': return renderPostit();
    case 'TOPIC':  return renderTopic();
    case 'VOTE':   return loadBallot();
    case 'RESULT': return renderResultWait();
    case 'FINAL':  return loadFinal();
    case 'REFLECT': return loadReflect();
    default:       return renderWait();
  }
}

function head_() {
  return '<h1>' + esc(S.work) + '</h1><div class="sub">' + esc(S.name) + ' · 세션 ' + esc(S.code) + '</div>';
}

function banner_(text) {
  return '<div class="task-banner">' + text + '</div>';
}

function renderWait() {
  app(head_() + '<div class="wait-box"><div class="big">📖</div>' +
    '<h2>잠시 기다려 주세요</h2><div class="sub">선생님이 다음 단계를 열면 화면이 바뀝니다</div></div>');
}

/* ───────── 1단계: 밑줄 긋기 ───────── */
function renderPostit() {
  app(head_() +
    banner_('1단계 · 논제의 씨앗에 밑줄 긋기 ✏️') +
    '<div class="card">' +
    '<div class="sub">이런 부분에 밑줄을 그으세요 — <b>반이 갈릴 것 같은 문장</b>, ' +
    '읽다가 <b>마음에 걸린 부분</b>, <b>작가는 왜 이렇게 썼을까 싶은 부분</b>. 여러 개 낼 수 있습니다.</div>' +
    '<label>문단 번호</label><input type="number" id="p-para" placeholder="밑줄 그은 곳의 문단 번호" inputmode="numeric">' +
    '<label>밑줄 그은 구절 (그대로 옮겨 적기)</label>' +
    '<textarea id="p-phrase" placeholder="예) 나무들은 쑥쑥 자랐다. 마치 인간의 거짓말을 알고 있는 것처럼."></textarea>' +
    '<label>왜 눈에 걸렸나 (선택, 한마디)</label>' +
    '<input type="text" id="p-comment" placeholder="예) 마지막 문장이 인간을 비난하는 것 같아서">' +
    '<button class="btn" onclick="sendPostit()">밑줄 제출</button>' +
    (S.postitCount ? '<div class="chip ok" style="margin-top:12px">지금까지 ' + S.postitCount + '개 제출 ✓</div>' : '') +
    '</div>');
}

function sendPostit() {
  var phrase = $('p-phrase').value.trim();
  var para = $('p-para').value.trim();
  if (!phrase) return alert('밑줄 그은 구절을 옮겨 적어 주세요.');
  if (!para) return alert('문단 번호를 적어 주세요.');
  var btn = document.querySelector('.btn'); btn.disabled = true;
  run(function () {
    S.postitCount++; renderPostit();
  }, function (e) { btn.disabled = false; alert(e.message || e); })
  .submitPostit(S.code, S.name, phrase, $('p-comment').value.trim(), para);
}

/* ───────── 2단계: 논제 만들기 ───────── */
var FRAME_HELP = {
  A: '💡 가장 쉬운 길입니다. 인물의 행동 하나에 판단(술어)을 내리면 그게 논제입니다. 어떤 술어를 고르느냐가 전부예요 — "슬프다"에는 아무도 반대하지 않지만, "불가피했다"에는 반이 갈립니다.',
  B: '💡 흔한 해석을 뒤집는 틀입니다. "다들 X라고 하지만, 사실은 Y다"라고 세우면 반대할 사람이 저절로 생깁니다.',
  F: '💡 틀 없이 직접 씁니다. 대신 위의 좋은 논제 조건 세 가지를 스스로 지켜야 합니다.',
  R: '💡 논제가 안 떠오르면 여기서 시작하세요. 고장 난 논제를 진단하고 고치다 보면 좋은 논제의 감이 잡힙니다. 고친 문장이 그대로 내 논제로 제출됩니다.'
};

function renderTopicLesson() {
  app(head_() +
    banner_('2단계 · 먼저, 좋은 논제란 무엇일까? 🎓') +
    '<div class="card">' +
    '<div class="sub"><b>논제</b>는 토론이 되는 한 문장입니다. 조건은 세 가지뿐입니다.</div>' +
    '<div class="guide" style="margin-top:12px">' +
    '① 우리 반이 찬성과 반대로 <b>갈린다</b><br>' +
    '② 근거를 <b>본문 문단 번호</b>로 댈 수 있다<br>' +
    '③ 주장이 <b>한 개</b>다</div>' +
    '<div class="divider">❖ ❖ ❖</div>' +
    '<div class="check-row"><div>✗</div><div>"피노키오는 불쌍하다"<br><span class="sub">아무도 반대하지 않는다 → 토론이 안 됨</span></div></div>' +
    '<div class="check-row"><div>✓</div><div>"피노키오의 마지막 소원은 배신이 아니라 귀향이다"<br><span class="sub">반이 갈린다</span></div></div>' +
    '<div class="check-row"><div>✗</div><div>"우정은 소중하다"<br><span class="sub">책을 안 읽은 사람도 말할 수 있다 → 탈락</span></div></div>' +
    '<div class="check-row"><div>✓</div><div>"방송국이 철수를 피노키오로 내보낸 것은 불가피했다"<br><span class="sub">본문을 봐야 싸울 수 있다</span></div></div>' +
    '<div class="guide" style="margin-top:14px">주어가 꼭 인물일 필요는 없습니다. <b>작가, 제목, 결말, 서술 방식</b>도 훌륭한 논제가 됩니다.<br>' +
    '<span class="sub">예) "이 소설의 제목은 \'철수의 꿈\'이었어야 한다" / "작가가 결말을 한 줄로 끝낸 것은 성공적이다"</span></div>' +
    '<button class="btn" onclick="S.lessonSeen=true;renderTopic()">좋아요, 내 논제 만들러 가기 →</button>' +
    '</div>');
}

function renderTopic() {
  if (!S.lessonSeen) return renderTopicLesson();
  app(head_() +
    banner_('2단계 · 밑줄 그은 문장으로 논제 만들기 ✍️') +
    '<div class="card">' +
    '<details class="guide"><summary>💡 좋은 논제란? — 도움말 다시 보기</summary>' +
    '<b>좋은 논제의 조건 세 가지</b><br>' +
    '① 우리 반이 찬성과 반대로 갈린다 &nbsp;② 근거를 본문 문단 번호로 댈 수 있다 &nbsp;③ 주장이 한 개다<br>' +
    '<span class="sub">만드는 법: 1단계에서 밑줄 그은 문장 하나를 골라, <b>[주어] + [선택·행동] + [판단]</b> 한 문장으로 만드세요. ' +
    '주어는 인물·작가·제목·결말 무엇이든 좋지만, <b>작품의 핵심어가 없으면 제출되지 않습니다.</b></span></details>' +
    '<div class="tabs">' +
    tab_('A', '틀 A · 술어형') + tab_('B', '틀 B · 대비형') +
    tab_('F', '자유 서술') + tab_('R', '⚠ 수리') +
    '</div><div class="sub" id="frame-help" style="margin-top:10px"></div>' +
    '<div id="frame-body"></div>' +
    '<div class="preview" id="preview">논제 미리보기</div>' +
    '<div id="auto-chips"></div>' +
    '<div class="divider">❖ ❖ ❖</div>' +
    '<h2>자가검사 — 모두 통과해야 제출됩니다</h2><div id="selfcheck"></div>' +
    '<button class="btn" id="submit-btn" disabled onclick="sendTopic()">논제 제출</button>' +
    (S.myTopics.length ?
      '<div class="mine-list"><b>내가 낸 논제</b><ul>' +
      S.myTopics.map(function (t) { return '<li>' + esc(t.text) + '</li>'; }).join('') +
      '</ul></div>' : '') +
    '</div>');
  renderSelfCheck();
  setFrame(S.frame);
}

function tab_(key, label) {
  return '<button class="tab' + (S.frame === key ? ' on' : '') + '" onclick="setFrame(\'' + key + '\')">' + label + '</button>';
}

function setFrame(key) {
  S.frame = key;
  document.querySelectorAll('.tab').forEach(function (el, i) {
    el.classList.toggle('on', ['A', 'B', 'F', 'R'][i] === key);
  });
  var charOpts = '<option value="">주어 선택</option>' + S.characters.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');
  var html = '';
  if (key === 'A') {
    var predOpts = '<option value="">술어 선택</option>' + S.predicateBank.map(function (set, i) {
      return '<optgroup label="' + (i + 1) + '군">' + set.map(function (p) {
        return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    html = '<label>주어 (인물·작가·작품 요소)</label><select id="fa-char" onchange="buildText()">' + charOpts + '</select>' +
      '<label>행동 (~한 것 / ~한 판단)</label><input type="text" id="fa-act" oninput="buildText()" placeholder="예) 마지막 소원">' +
      '<label>술어 — 그대로 두지 말고 따져 보세요</label><select id="fa-pred" onchange="buildText()">' + predOpts + '</select>';
  } else if (key === 'B') {
    html = '<label>주어 (인물·작가·작품 요소)</label><select id="fb-char" onchange="buildText()">' + charOpts + '</select>' +
      '<label>행동</label><input type="text" id="fb-act" oninput="buildText()" placeholder="예) 마지막 소원">' +
      '<label>사람들이 흔히 하는 말 (통념)</label><input type="text" id="fb-x" oninput="buildText()" placeholder="예) 배신">' +
      '<label>내가 보는 진짜 정체</label><input type="text" id="fb-y" oninput="buildText()" placeholder="예) 귀향">';
  } else if (key === 'F') {
    html = '<label>논제 (완성된 한 문장)</label><textarea id="ff-text" oninput="buildText()" placeholder="인물 이름을 넣어 완성된 논제 한 문장을 쓰세요"></textarea>';
  } else {
    html = '<div class="sub" style="margin-top:12px">⚠ 아래 논제는 <b>고장 나 있습니다.</b> 어디가 고장인지 찾아 고쳐 쓰세요.</div>' +
      S.brokenCards.map(function (c, i) {
        return '<div class="check-row"><input type="radio" name="broken" ' + (i === S.brokenPick ? 'checked' : '') +
          ' onchange="pickBroken(' + i + ')"><div>' + esc(c.text) +
          '<div><button class="hint-toggle" onclick="this.nextElementSibling.style.display=\'block\';this.remove()">힌트 보기</button>' +
          '<span style="display:none;font-size:12px;color:var(--plum)">' + esc(c.hint) + '</span></div></div></div>';
      }).join('') +
      '<label>고쳐 쓴 논제</label><textarea id="fr-text" oninput="buildText()" placeholder="인물 이름을 넣어 고장을 고친 논제를 쓰세요"></textarea>';
  }
  $('frame-body').innerHTML = html;
  var help = $('frame-help');
  if (help) help.textContent = FRAME_HELP[key];
  buildText();
}

function pickBroken(i) { S.brokenPick = i; }

function josa(word, withBatchim, without) {
  if (!word) return withBatchim + '(' + without + ')';
  var ch = word.charCodeAt(word.length - 1);
  if (ch < 0xAC00 || ch > 0xD7A3) return withBatchim + '(' + without + ')';
  return ((ch - 0xAC00) % 28) ? withBatchim : without;
}

function currentText() {
  try {
    if (S.frame === 'A') {
      var c = $('fa-char').value, a = $('fa-act').value.trim(), p = $('fa-pred').value;
      return (c && a && p) ? c + '의 ' + a + josa(a, '은', '는') + ' ' + p + '.' : '';
    }
    if (S.frame === 'B') {
      var c2 = $('fb-char').value, a2 = $('fb-act').value.trim(),
          x = $('fb-x').value.trim(), y = $('fb-y').value.trim();
      return (c2 && a2 && x && y) ?
        c2 + '의 ' + a2 + josa(a2, '은', '는') + ' ' + x + josa(x, '이', '가') + ' 아니라 ' +
        y + josa(y, '이다', '다') + '.' : '';
    }
    if (S.frame === 'F') return $('ff-text').value.trim();
    return $('fr-text').value.trim();
  } catch (e) { return ''; }
}

function buildText() {
  var t = currentText();
  $('preview').textContent = t || '논제 미리보기';
  var chips = '';
  if (t) {
    var norm = t.replace(/\s+/g, '');
    var hasChar = S.characters.some(function (c) { return norm.indexOf(c.replace(/\s+/g, '')) >= 0; });
    chips += hasChar ? '<span class="chip ok">핵심어 ✓</span>'
                     : '<span class="chip bad">핵심어 없음 — 제출 불가 (인물·작가·제목 등)</span>';
    if (/그리고|그런데/.test(t)) chips += '<span class="chip warn">\'그리고·그런데\' — 논제가 2개 아닌가요?</span>';
  }
  $('auto-chips').innerHTML = chips;
  updateSubmit();
}

function renderSelfCheck() {
  $('selfcheck').innerHTML = S.selfCheck.map(function (q, i) {
    return '<div class="check-row"><input type="checkbox" id="sc-' + i + '" onchange="updateSubmit()"><div>' + esc(q) + '</div></div>';
  }).join('');
}

function updateSubmit() {
  var t = currentText();
  var norm = t.replace(/\s+/g, '');
  var hasChar = S.characters.some(function (c) { return norm.indexOf(c.replace(/\s+/g, '')) >= 0; });
  var checks = S.selfCheck.every(function (_, i) { return $('sc-' + i) && $('sc-' + i).checked; });
  $('submit-btn').disabled = !(t.length >= 5 && hasChar && checks);
}

function sendTopic() {
  var btn = $('submit-btn'); btn.disabled = true;
  var frameName = { A: '틀A', B: '틀B', F: '자유', R: '수리' }[S.frame];
  run(function (res) {
    S.myTopics.push({ id: res.id, text: currentText() });
    renderTopic();
    window.scrollTo(0, 0);
  }, function (e) { btn.disabled = false; alert(e.message || e); })
  .submitTopic(S.code, S.name, {
    text: currentText(), frame: frameName, before: '', after: '', reason: ''
  });
}

/* ───────── 3단계: 투표 ───────── */
function loadBallot() {
  app(head_() + '<div class="wait-box"><div class="big">🗳️</div>투표판을 가져오는 중...</div>');
  run(function (b) {
    S.ballot = b; S.starLimit = b.starLimit;
    S.votes = {}; S.voteSubmitted = b.alreadyVoted;
    b.topics.forEach(function (t) { S.votes[t.id] = { star: false, stance: '' }; });
    if (S.voteSubmitted) renderVoteDone(); else renderBallot();
  }).getBallot(S.code, S.name);
}

function renderBallot() {
  var cards = S.ballot.topics.map(function (t) {
    var v = S.votes[t.id];
    return '<div class="vote-card"><div class="t">' + esc(t.text) + '</div>' +
      '<div class="vote-row">' +
      '<button class="star-btn' + (v.star ? ' on' : '') + '" onclick="toggleStar(\'' + t.id + '\')">⭐</button>' +
      '<div class="stance">' +
      '<button class="pro' + (v.stance === '찬성' ? ' on' : '') + '" onclick="setStance(\'' + t.id + '\',\'찬성\')">찬성</button>' +
      '<button class="con' + (v.stance === '반대' ? ' on' : '') + '" onclick="setStance(\'' + t.id + '\',\'반대\')">반대</button>' +
      '</div></div></div>';
  }).join('');
  app(head_() +
    banner_('3단계 · 친구들의 논제에 투표하기 🗳️ (⭐는 ' + S.starLimit + '개, 찬반은 전부)') +
    '<div class="guide">' + S.ballot.guide + '</div>' +
    (S.ballot.topics.length ? cards :
      '<div class="wait-box"><div class="big">🍃</div>투표할 논제가 없습니다</div>'));
  renderVoteFooter();
}

function toggleStar(id) {
  var v = S.votes[id];
  var used = Object.keys(S.votes).filter(function (k) { return S.votes[k].star; }).length;
  if (!v.star && used >= S.starLimit) {
    alert('별은 ' + S.starLimit + '개까지입니다. 다른 별을 빼고 다시 붙이세요.');
    return;
  }
  v.star = !v.star;
  renderBallot();
}
function setStance(id, s) {
  S.votes[id].stance = (S.votes[id].stance === s) ? '' : s;
  renderBallot();
}

function renderVoteFooter() {
  var total = S.ballot.topics.length;
  var done = Object.keys(S.votes).filter(function (k) { return S.votes[k].stance; }).length;
  var stars = Object.keys(S.votes).filter(function (k) { return S.votes[k].star; }).length;
  var ready = total > 0 && done === total;
  var f = $('footer');
  f.style.display = 'block';
  f.innerHTML = '<div class="inner"><div class="stat">⭐ ' + stars + '/' + S.starLimit +
    ' · 찬반 표시 ' + done + '/' + total + '</div>' +
    '<button class="btn" ' + (ready ? '' : 'disabled') + ' onclick="sendVotes()">투표 완료</button></div>';
}

function sendVotes() {
  if (!confirm('투표를 제출할까요? 제출 후에도 투표가 닫히기 전이면 다시 할 수 있습니다.')) return;
  var votes = S.ballot.topics.map(function (t) {
    return { id: t.id, star: S.votes[t.id].star, stance: S.votes[t.id].stance };
  });
  $('footer').querySelector('.btn').disabled = true;
  run(function () { S.voteSubmitted = true; renderVoteDone(); },
      function (e) { renderVoteFooter(); alert(e.message || e); })
  .submitVotes(S.code, S.name, votes);
}

function renderVoteDone() {
  app(head_() + '<div class="wait-box"><div class="big">✅</div><h2>투표 완료!</h2>' +
    '<div class="sub">결과는 선생님이 투표를 닫으면 칠판 화면에서 공개됩니다</div>' +
    '<button class="btn-ghost" onclick="loadBallotAgain()">투표 다시 하기</button></div>');
}
function loadBallotAgain() { S.voteSubmitted = false; renderBallot(); }

function renderResultWait() {

var REBUT_TYPES = ['재해석 — 같은 문단, 다른 읽기', '반례 — 다른 문단 제시', '연결 공격 — 인용과 주장의 비약'];

    '카드가 모이면 아래 [📜 연설문]이 완성됩니다.</div>' +

    '<label>우리 모둠의 입장</label><div class="stance">' +

    '<button class="con' + (d.stance === '반대' ? ' on' : '') + '" onclick="setTeamStance(\'반대\')">반대</button></div>' +
    '<div class="tabs">' +
    dTab_('입론', '📖 입론') + dTab_('반론', '🔥 반론') +
    '</div><div id="dc-body-area"></div>' +
    '<button class="btn" onclick="sendDebateCard()">카드 제출</button>' +
    (d.myCards.length ?
      '<div class="mine-list"><b>내가 낸 카드</b><ul>' +
      d.myCards.map(function (c) {
        return '<li>[' + esc(c.kind) + (c.para ? ' · 문단 ' + esc(c.para) : '') + '] ' + esc(c.body) + '</li>';
      }).join('') + '</ul></div>' : '') +
    '<button class="btn-ghost" onclick="renderSpeech()">📜 우리 팀 발표문 정리하기</button>' +
    '</div>');

}

function setTeamStance(s) {
  S.debate.stance = s;
  renderDebate();
}

function endDot_(s) {
  s = String(s || '').trim();
  return s && !/[.!?]$/.test(s) ? s + '.' : s;
}

function speechDraft_() {
  var d = S.debate;
  var topic = d.topics[0];
  for (var i = 0; i < d.topics.length; i++) {
    if (d.topics[i].id === d.topicId) topic = d.topics[i];
  }
  var ORD = ['첫째', '둘째', '셋째', '넷째', '다섯째', '여섯째', '일곱째'];
  var ip = d.myCards.filter(function (c) { return c.kind === '입론'; });
  var rb = d.myCards.filter(function (c) { return c.kind === '반론'; });
  var lines = [];
  if (ip.length) {
    lines.push('저희는 "' + (topic ? topic.text : '') + '"에 ' + d.stance + '합니다.');
    ip.forEach(function (c, i) {
      lines.push((ORD[i] || (i + 1) + '번째') + ', ' + endDot_(c.body) +
        ' 본문 ' + c.para + '번 문단을 보면' +
        (c.quote ? ' "' + c.quote + '"라고 되어 있습니다.' : ' 근거를 확인할 수 있습니다.') +
        (c.interp ? ' ' + endDot_(c.interp) : ''));
    });
    lines.push('그래서 저희는 이 논제에 다시 한 번 ' + d.stance + '합니다.');
  }
  if (rb.length) {
    lines.push('');
    lines.push('[반론]');
    rb.forEach(function (c) {
      lines.push('상대측은 "' + c.interp + '"라고 주장했습니다. 하지만 저희는 그 대목을 다르게 읽었습니다. ' +
        endDot_(c.body) +
        (c.para ? ' 본문 ' + c.para + '번 문단이 저희 반론의 근거입니다.' : ''));
    });
    lines.push('이상으로 상대측 주장에 대한 저희 팀의 반론을 마칩니다.');
  }
  return lines.join('\n\n');
}

function renderSpeech() {
  var d = S.debate;
  if (!d.stance) { alert('먼저 우리 모둠의 입장(찬성/반대)을 선택하세요.'); return; }
  app(head_() +
    banner_('📜 우리 팀 발표문 — 다듬어서 저장하세요') +
    '<div class="card">' +
    '<div class="sub">카드로 만든 <b>초안</b>이 채워져 있습니다. 모둠의 말로 자연스럽게 고쳐 쓰고 ' +
    '<b>[발표문 저장]</b>을 누르세요. 발표 때 이 화면을 보며 읽습니다.</div>' +
    '<label>모둠 구성원 (팀 구분용)</label>' +
    '<input type="text" id="sp-members" value="' + esc(S.debate.members || '') + '" placeholder="예) 홍길동, 김철수, 이영희">' +
    '<textarea id="sp-text" style="min-height:340px;margin-top:12px;' +
    "font-family:'Gowun Batang',serif;font-size:16px;line-height:1.8\" " +
    'placeholder="카드를 먼저 제출하면 초안이 자동으로 만들어집니다"></textarea>' +
    '<button class="btn" onclick="saveSpeechNow()">발표문 저장</button>' +
    '<button class="btn-ghost" onclick="refillDraft()">↺ 카드로 초안 다시 만들기</button>' +
    '<button class="btn-ghost" onclick="renderDebate()">← 카드 화면으로 돌아가기</button>' +
    '</div>');
  window.scrollTo(0, 0);
  if (S.debate.speechText != null) {
    $('sp-text').value = S.debate.speechText;
  } else {
    run(function (sp) {
      S.debate.speechText = (sp && sp.text) ? sp.text : speechDraft_();
      var el = $('sp-text');
      if (el) el.value = S.debate.speechText;
    }, function () {
      var el = $('sp-text');
      if (el) el.value = speechDraft_();
    }).getSpeech(S.code, S.debate.topicId, S.debate.stance, S.debate.members || '');
  }
}

function refillDraft() {
  if (!confirm('지금 쓴 내용을 지우고 카드 초안으로 다시 채울까요?')) return;
  $('sp-text').value = speechDraft_();
}

function saveSpeechNow() {
  var t = $('sp-text').value.trim();
  var members = $('sp-members') ? $('sp-members').value.trim() : (S.debate.members || '');
  if (!t) return alert('발표문이 비어 있습니다.');
  if (!members) return alert('모둠 구성원을 입력하세요 (팀 구분에 사용됩니다).');
  var btn = document.querySelector('.card .btn');
  if (btn) btn.disabled = true;
  run(function () {
    S.debate.speechText = t;
    S.debate.members = members;
    if (btn) { btn.disabled = false; btn.textContent = '저장됨 ✓ (다시 저장 가능)'; }
  }, function (e) { if (btn) btn.disabled = false; alert(e.message || e); })
  .saveSpeech(S.code, S.name, S.debate.topicId, S.debate.stance, members, t);
}

function dTab_(kind, label) {
  return '<button class="tab' + (S.debate.kind === kind ? ' on' : '') +
    '" onclick="S.debate.kind=\'' + kind + '\';renderDebate()">' + label + '</button>';
}

function membersField_() {
  return '<label>모둠 구성원 이름 (쉼표로 구분)</label>' +
    '<input type="text" id="dc-members" placeholder="예) 홍길동, 김철수, 이영희" value="' +
    esc(S.debate.members || '') + '">';
}

function renderDebateForm() {
  var k = S.debate.kind, html = '';
  var styleHint = '<div class="sub" style="margin-top:10px">✏️ 여기 쓴 문장이 발표문에 그대로 들어갑니다. ' +
    "<b>'~입니다'체</b>로 쓰면 발표문이 매끄러워요.</div>";
  if (k === '입론') {
    html = styleHint + membersField_() +
      '<label>주장 (한 줄)</label><input type="text" id="dc-body" placeholder="예) 마지막 소원은 배신이 아닙니다">' +
      '<label>근거 문단 번호 — 없으면 제출 불가</label><input type="number" id="dc-para" inputmode="numeric" placeholder="본문 문단 번호">' +
      '<label>인용문 (선택 — 핵심 구절만)</label><textarea id="dc-quote" placeholder="본문 그대로 옮겨 적기"></textarea>' +
      '<label>해석 — 이 문단이 왜 우리 편 근거인가 (한 줄)</label><input type="text" id="dc-interp" placeholder="베낄 수 없는 칸입니다">';
  } else {
    html = styleHint + membersField_() +
      '<label>상대 주장 (들은 대로 한 줄)</label><input type="text" id="dc-target" placeholder="예) 피노키오는 노인을 사랑했다">' +
      '<label>반론 유형</label>' +
      REBUT_TYPES.map(function (w, i) {
        return '<div class="check-row"><input type="radio" name="dc-type" value="' + esc(w.split(' ')[0]) + '"' +
          (i === 0 ? ' checked' : '') + ' onchange="rtHelp()"><div>' + esc(w) + '</div></div>';
      }).join('') +
      '<div class="sub" id="rt-help" style="margin:8px 0"></div>' +
      '<label>근거 문단 번호 — 없으면 제출 불가</label><input type="number" id="dc-para" inputmode="numeric" placeholder="다시 읽은 그 문단">' +
      '<label>반론 문장 — 입론만큼 충분히 쓰세요 (2~3문장)</label><textarea id="dc-body" placeholder="예) 문단 12는 오히려 …를 보여줍니다. 왜냐하면 …이기 때문입니다."></textarea>';
  }
  $('dc-body-area').innerHTML = html;
  if (k === '반론') rtHelp();
}

var RT_HELP = {
  '재해석': '상대가 쓴 <b>바로 그 문단</b>을 다르게 읽습니다. 상대의 근거를 빼앗는 가장 강한 반론. 예) "그 장면은 사랑이 아니라 몸에 밴 역할이다"',
  '반례': '<b>다른 문단</b>을 가져와 상대 주장을 무너뜨립니다. 예) "45번 문단을 보면 그 해석은 성립하지 않는다"',
  '연결': '인용은 인정하되 <b>주장까지 이어지지 않음</b>을 지적합니다. 예) "그 인용이 사실이어도 사랑했다고까지는 할 수 없다"'
};

function rtHelp() {
  var el = $('rt-help');
  if (el) el.innerHTML = RT_HELP[radioVal_('dc-type')] || '';
}

function radioVal_(name) {
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}

function sendDebateCard() {
  var k = S.debate.kind;
  if (!S.debate.stance) {
    alert('먼저 우리 모둠의 입장(찬성/반대)을 선택하세요.');
    return;
  }
  var payload = {
    topicId: S.debate.topicId, kind: k, stance: S.debate.stance,
    body: $('dc-body') ? $('dc-body').value.trim() : '',
    para: $('dc-para') ? $('dc-para').value.trim() : '',
    members: $('dc-members') ? $('dc-members').value.trim() : '',
    quote: '', interp: '', target: ''
  };
  if (k === '입론') {
    payload.quote = $('dc-quote').value.trim();
    payload.interp = $('dc-interp').value.trim();
  } else {
    payload.quote = radioVal_('dc-type');
    payload.target = $('dc-target') ? $('dc-target').value.trim() : '';
  }
  var btn = document.querySelector('.card .btn'); if (btn) btn.disabled = true;
  run(function () {
    if (payload.members) S.debate.members = payload.members; // 다음 카드에 자동 입력
    S.debate.myCards.push({ kind: k, para: payload.para, body: payload.body,
      quote: payload.quote, interp: k === '반론' ? payload.target : payload.interp });
    renderDebate();
    window.scrollTo(0, document.body.scrollHeight);
  }, function (e) { if (btn) btn.disabled = false; alert(e.message || e); })
  .submitDebateCard(S.code, S.name, payload);
}

/* ───────── 토론 후: 개인 소감 (개인 활동) ───────── */
var REFLECT_KINDS = ['작품과 나', '작품과 세상', '생각의 변화', '자유'];
var REFLECT_PH = {
  '작품과 나': '예) 나도 누군가의 호의를 받으면 의도부터 의심하게 될 때가 있다…',
  '작품과 세상': '예) 뉴스에서 본 일들이 이 소설을 읽고 나니 다르게 보인다…',
  '생각의 변화': '예) 토론 전에는 …라고 생각했는데, 상대편의 …라는 말을 듣고 …',
  '자유': '떠오르는 생각을 자유롭게 적어 보세요'
};

function loadReflect() {
  app(head_() + '<div class="wait-box"><div class="big">🌱</div>불러오는 중...</div>');
  run(function (res) {
    S.reflect = { myCards: res.myCards, myText: res.myText,
                  kind: (S.reflect && S.reflect.kind) || '작품과 나' };
    renderReflect();
  }).getReflectHome(S.code, S.name);
}

function renderReflect() {
  var r = S.reflect;
  app(head_() +
    banner_('토론 후 · 나의 생각 쓰기 🌱 (개인 활동)') +
    '<div class="card">' +
    '<div class="sub"><b>책에 머물지 않아도 됩니다.</b> 작품과 나의 경험, 작품과 세상, ' +
    '토론이 바꾼 내 생각 — 무엇이든 좋습니다. 짧은 카드 여러 장을 쓰고, 마지막에 한 편으로 정리하세요.</div>' +
    '<div class="tabs">' +
    REFLECT_KINDS.map(function (k) {
      return '<button class="tab' + (r.kind === k ? ' on' : '') +
        '" onclick="S.reflect.kind=\'' + k + '\';renderReflect()">' + k + '</button>';
    }).join('') + '</div>' +
    '<label>' + esc(r.kind) + '</label>' +
    '<textarea id="r-body" placeholder="' + esc(REFLECT_PH[r.kind]) + '"></textarea>' +
    '<button class="btn" onclick="sendReflectCard()">소감 카드 제출</button>' +
    (r.myCards.length ?
      '<div class="mine-list"><b>내가 낸 소감 카드</b><ul>' +
      r.myCards.map(function (c) {
        return '<li>[' + esc(c.kind) + '] ' + esc(c.body) + '</li>';
      }).join('') + '</ul></div>' : '') +
    '<button class="btn-ghost" onclick="renderReflectEditor()">📝 내 소감문 정리하기</button>' +
    '</div>');
}

function sendReflectCard() {
  var body = $('r-body').value.trim();
  if (!body) return alert('내용을 적어 주세요.');
  var btn = document.querySelector('.card .btn');
  if (btn) btn.disabled = true;
  run(function () {
    S.reflect.myCards.push({ kind: S.reflect.kind, body: body });
    renderReflect();
  }, function (e) { if (btn) btn.disabled = false; alert(e.message || e); })
  .submitReflectCard(S.code, S.name, S.reflect.kind, body);
}

function reflectDraft_() {
  return S.reflect.myCards.map(function (c) { return c.body; }).join('\n\n');
}

function renderReflectEditor() {
  app(head_() +
    banner_('📝 나의 최종 소감문 — 다듬어서 저장하세요') +
    '<div class="card">' +
    '<div class="sub">카드로 만든 초안이 채워져 있습니다. 내 글로 자연스럽게 다듬고 <b>[소감문 저장]</b>을 누르세요.</div>' +
    '<textarea id="rf-text" style="min-height:340px;margin-top:12px;' +
    "font-family:'Gowun Batang',serif;font-size:16px;line-height:1.8\" " +
    'placeholder="소감 카드를 먼저 쓰면 초안이 자동으로 만들어집니다"></textarea>' +
    '<button class="btn" onclick="saveReflectionNow()">소감문 저장</button>' +
    '<button class="btn-ghost" onclick="refillReflect()">↺ 카드로 초안 다시 만들기</button>' +
    '<button class="btn-ghost" onclick="renderReflect()">← 카드 화면으로 돌아가기</button>' +
    '</div>');
  window.scrollTo(0, 0);
  $('rf-text').value = (S.reflect.myText != null && S.reflect.myText !== '')
    ? S.reflect.myText : reflectDraft_();
}

function refillReflect() {
  if (!confirm('지금 쓴 내용을 지우고 카드 초안으로 다시 채울까요?')) return;
  $('rf-text').value = reflectDraft_();
}

function saveReflectionNow() {
  var t = $('rf-text').value.trim();
  if (!t) return alert('소감문이 비어 있습니다.');
  var btn = document.querySelector('.card .btn');
  if (btn) btn.disabled = true;
  run(function () {
    S.reflect.myText = t;
    if (btn) { btn.disabled = false; btn.textContent = '저장됨 ✓ (다시 저장 가능)'; }
  }, function (e) { if (btn) btn.disabled = false; alert(e.message || e); })
  .saveReflection(S.code, S.name, t);
}

/* ───────── 시작 ───────── */
renderJoin();
</script>

<script>
/* 시연: '강민서' 학생이 각 단계에서 직접 작성한 예시가 채워집니다 */
window.addEventListener('DOMContentLoaded', function () {
  setTimeout(function () {
    window.__MOCK.votes = window.__MOCK.votes.filter(function (v) { return v.voter !== '강민서'; });
    localStorage.removeItem('gg_join');
    document.getElementById('j-code').value = '1234';
    document.getElementById('j-name').value = '강민서';
    join();
  }, 400);

  var done = { postit: false, topic: false, vote: false, debate: false, reflect: false };
  setInterval(function () {
    try {
      if (S.phase === 'POSTIT' && !done.postit && document.getElementById('p-phrase')) {
        done.postit = true;
        document.getElementById('p-para').value = '61';
        document.getElementById('p-phrase').value = '어떤 의도 같은 게 있을 리 없다고 생각하면서도 네가 한 말의 의미를 자꾸 요리조리 돌려보게 됐다.';
        document.getElementById('p-comment').value = '나도 이 소설을 이렇게 읽고 있어서';
      }
      if (S.phase === 'TOPIC' && S.lessonSeen && !done.topic && document.getElementById('frame-body')) {
        done.topic = true;
        setFrame('R');
        var radios = document.querySelectorAll('input[name="broken"]');
        if (radios[2]) radios[2].checked = true;
        document.getElementById('fr-text').value = "너를 만난 것은 '나'에게 잘못이었다.";
        buildText();
        for (var i = 0; i < 5; i++) { var el = document.getElementById('sc-' + i); if (el) el.checked = true; }
        updateSubmit();
      }
      if (S.phase === 'VOTE' && S.ballot && !S.voteSubmitted && !done.vote && document.querySelector('.vote-card')) {
        done.vote = true;
        S.ballot.topics.forEach(function (t, i) {
          var v = S.votes[t.id]; if (!v) return;
          if (t.text.indexOf('진심') >= 0 || t.text.indexOf('체념') >= 0 || t.text.indexOf('제목') >= 0) v.star = true;
          v.stance = (i % 3 === 0) ? '반대' : '찬성';
        });
        renderBallot();
      }
      if (S.phase === 'FINAL' && S.debate && !done.debate && document.querySelector('.tabs')) {
        done.debate = true;
        S.debate.stance = '찬성';
        S.debate.members = '김하늘, 박준우, 손예린, 조아인, 강민서';
        S.debate.myCards.push({ kind: '입론', para: '6',
          body: '너는 사람과 고양이 모두를 놀래지 않으려 애씁니다',
          quote: '태비와 나 모두를 놀래지 않으려는 듯 한 발 한 발 다가서는 네 모습은 신중해 보였고',
          interp: '몸에 밴 조심스러움은 연기로 만들 수 없습니다' });
        renderDebate();
        setTimeout(function () {
          var f = { 'dc-members': S.debate.members,
                    'dc-body': '너는 비용 앞에서 흔들리지 않습니다',
                    'dc-para': '27',
                    'dc-quote': '계속 추가되는 병원비와 입원비 내역을 듣는 네 얼굴에선 걱정스럽거나 놀라운 기색을 발견하기 어려웠다',
                    'dc-interp': '아까워하는 마음이 없는 자리에 거짓은 끼어들기 어렵습니다' };
          Object.keys(f).forEach(function (id) {
            var el = document.getElementById(id); if (el) el.value = f[id];
          });
        }, 250);
      }
      if (S.phase === 'REFLECT' && S.reflect && !done.reflect && document.getElementById('r-body')) {
        done.reflect = true;
        document.getElementById('r-body').value = '토론이 끝났는데도 너라는 사람이 계속 생각난다. 다 알 수 없는 사람을 다 알 수 없는 채로 이해하는 것, 그게 이 소설이 시키는 일 같다.';
      }
    } catch (e) {}
  }, 700);
});
</script>
</body>
